<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>MeowsClock — виджет</title>
  <link rel="stylesheet" href="../../node_modules/flag-icons/css/flag-icons.min.css" />
  <link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div class="widget" id="widget">
    <div class="grip left" data-edge="left" title="Потяните, чтобы изменить ширину"></div>
    <div class="grip right" data-edge="right" title="Потяните, чтобы изменить ширину"></div>
    <div class="w-head">
      <div class="w-brand">
        <img class="w-icon" src="../../assets/icon-small.png" alt="" />
        <div class="w-title">
          <span>MeowsClock</span>
          <span id="today" class="status"></span>
        </div>
      </div>
      <div class="w-actions">
        <button id="w-add" title="Добавить город">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
        <button id="w-edit" title="Изменить список">
          <svg class="i-edit" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          <svg class="i-done" viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </button>
        <button id="w-menu" title="Меню">
          <svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
        </button>
      </div>
    </div>

    <div id="list-view">
      <div id="rows" class="rows"></div>
      <button id="empty" class="add-row" hidden>+ Добавить город</button>
    </div>

    <div id="picker-view" hidden>
      <div class="search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="search" type="text" placeholder="Город или страна" spellcheck="false" autocomplete="off" />
        <button id="picker-close" title="Готово (Esc)">
          <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div id="picker-list" class="picker-list"></div>
    </div>
  </div>

  <script src="cities.js"></script>
  <script src="clock.js"></script>
  <script src="widget.js"></script>
</body>
</html>
